name: main

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      project_files: ${{ steps.filter.outputs.project_files }}
      typing_linting_files: ${{ steps.filter.outputs.typing_linting_files }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          typing_linting_files:
            - '**/*.py'
            - .pre-commit-config.yaml
          project_files:
            - .github/workflows/main.yml
            - '**/*.py'
            - '**/*.toml'
            - '**/*requirements*.txt'
            - '**/setup.cfg'
            - custom_components/*/manifest.json
            - tox.ini
  pre-commit-typing-real:
    needs: [changes]
    if: needs.changes.outputs.typing_linting_files == 'true'
    uses: mxr/workflows/.github/workflows/pre-commit-typing.yml@a762c9558b6ece45521c72b5c91c73fad62bd3e6 # v0.1.4
  pre-commit-typing:
    needs: [changes, pre-commit-typing-real]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - env:
        TYPING_LINTING_FILES: ${{ needs.changes.outputs.typing_linting_files }}
        PRE_COMMIT_TYPING_REAL_RESULT: ${{ needs.pre-commit-typing-real.result }}
      run: |
        if [ "$TYPING_LINTING_FILES" != "true" ]; then
          exit 0
        fi
        if [ "$PRE_COMMIT_TYPING_REAL_RESULT" != "success" ]; then
          exit 1
        fi
  main-real:
    needs: [changes]
    if: needs.changes.outputs.project_files == 'true'
    uses: asottile/workflows/.github/workflows/tox.yml@75fa946a6d3d763b75b3a6669c18dc4d1822e939 # v1.11.1
    with:
      env: '["py314"]'
  main:
    needs: [changes, main-real]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - env:
        PROJECT_FILES: ${{ needs.changes.outputs.project_files }}
        MAIN_REAL_RESULT: ${{ needs.main-real.result }}
      run: |
        if [ "$PROJECT_FILES" != "true" ]; then
          exit 0
        fi
        if [ "$MAIN_REAL_RESULT" != "success" ]; then
          exit 1
        fi
