# ~~ Generated by projen in mxr/base. Modifications will be overwritten on the next sync. To modify properly, edit .github/base.yml and retrigger the propagate workflow in mxr/base.

name: validate-home-assistant

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      integration_files: ${{ steps.filter.outputs.integration_files }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          integration_files:
            - .github/workflows/validate-home-assistant.yml
            - custom_components/**
            - hacs.json

  hassfest-real:
    needs: [changes]
    if: needs.changes.outputs.integration_files == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hassfest:
    needs: [changes, hassfest-real]
    if: always()
    runs-on: ubuntu-26.04
    steps:
    - env:
        INTEGRATION_FILES: ${{ needs.changes.outputs.integration_files }}
        HASSFEST_REAL_RESULT: ${{ needs.hassfest-real.result }}
      run: |
        if [ "$INTEGRATION_FILES" != "true" ]; then
          exit 0
        fi
        if [ "$HASSFEST_REAL_RESULT" != "success" ]; then
          exit 1
        fi

  hacs-real:
    needs: [changes]
    if: needs.changes.outputs.integration_files == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
      with:
        category: integration
        comment: false
        ignore: brands

  hacs:
    needs: [changes, hacs-real]
    if: always()
    runs-on: ubuntu-26.04
    steps:
    - env:
        INTEGRATION_FILES: ${{ needs.changes.outputs.integration_files }}
        HACS_REAL_RESULT: ${{ needs.hacs-real.result }}
      run: |-
        if [ "$INTEGRATION_FILES" != "true" ]; then
          exit 0
        fi
        if [ "$HACS_REAL_RESULT" != "success" ]; then
          exit 1
        fi
