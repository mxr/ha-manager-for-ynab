# ~~ Generated by projen in mxr/base. Modifications will be overwritten on the next sync. To modify properly, edit .github/base.yml and retrigger the propagate workflow in mxr/base.

name: typing

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      typing_linting_files: ${{ steps.filter.outputs.typing_linting_files }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          typing_linting_files:
            - .github/workflows/typing.yml
            - '**/*.py'
            - .pre-commit-config.yaml

  typing-real:
    needs: [changes]
    if: needs.changes.outputs.typing_linting_files == 'true'
    uses: mxr/workflows/.github/workflows/pre-commit-typing.yml@a762c9558b6ece45521c72b5c91c73fad62bd3e6 # v0.1.4
  typing:
    needs: [changes, typing-real]
    if: always()
    runs-on: ubuntu-26.04
    steps:
    - env:
        TYPING_LINTING_FILES: ${{ needs.changes.outputs.typing_linting_files }}
        TYPING_REAL_RESULT: ${{ needs.typing-real.result }}
      run: |-
        if [ "$TYPING_LINTING_FILES" != "true" ]; then
          exit 0
        fi
        if [ "$TYPING_REAL_RESULT" != "success" ]; then
          exit 1
        fi
