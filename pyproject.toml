[dependency-groups]
test = [
  "covdefaults",
  "coverage",
  "homeassistant",
  "pytest",
  "pytest-asyncio",
  "pytest-homeassistant-custom-component",
]

[tool.coverage.run]  # generated by mxr/base
plugins = ["covdefaults"]

[tool.mypy]  # generated by mxr/base
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "testing.*"

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "tests.*"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]  # generated by mxr/base
target-version = "py314"

[tool.ruff.lint]  # generated by mxr/base
extend-select = [
  "A",  # see flake8-builtins
  "B",  # see flake8-bugbear
  "C4",  # see flake8-comprehension
  "I",  # sort imports
  "SIM",  # see flake8-simplify
  "TC",  # see flake8-type-checking
  "UP",  # see pyupgrade
]

[tool.ruff.lint.isort]  # generated by mxr/base
force-single-line = true

[tool.sqlfluff.layout.type.comma]  # generated by mxr/base
line_position = "leading"
spacing_before = "touch"

[tool.sqlfluff.layout.type.from_clause]  # generated by mxr/base
keyword_line_position = "leading"

[tool.sqlfluff.layout.type.when_clause]  # generated by mxr/base
keyword_line_position = "leading"

[tool.sqlfluff.rules.capitalisation.functions]  # generated by mxr/base
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]  # generated by mxr/base
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.keywords]  # generated by mxr/base
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]  # generated by mxr/base
capitalisation_policy = "upper"

[tool.sqlfluff.rules.convention.not_equal]  # generated by mxr/base
preferred_not_equal_style = "c_style"

[tool.sqlfluff.rules.convention.terminator]  # generated by mxr/base
multiline_newline = true
require_final_semicolon = true

[tool.sqlfluff.rules.references.quoting]  # generated by mxr/base
prefer_quoted_keywords = true

[tool.tox]  # generated by mxr/base
env_list = ["py", "pre-commit"]

[tool.tox.env.pre-commit]  # generated by mxr/base
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit-uv"]
skip_install = true

[tool.tox.env_run_base]  # generated by mxr/base
commands = [
  ["coverage", "erase"],
  ["coverage", "run", "-m", "pytest", "{posargs:tests}"],
  ["coverage", "report"],
]
commands_pre = [
  [
    "python",
    "-c",
    '''
import json
import pathlib
import subprocess
import sys

manifest = json.loads(next(pathlib.Path("custom_components").glob("*/manifest.json")).read_text())
subprocess.check_call(["uv", "pip", "install", "--python", sys.executable, *manifest["requirements"]])
''',
  ],
]
dependency_groups = ["test"]
skip_install = true

[tool.ty.rules]  # generated by mxr/base
all = "error"
