default_language_version:
  python: python3.14
ci:
  skip: [mypy, ty]  # venv is too big; runs with gihub action instead

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 7c55798a78262d14b2074abf623d8a992ebb70d4  # frozen: v0.16.2
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-commas]
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/mxr/mirrors-ty
  rev: a11e465e7066ef42fa224778028856b7e607291c  # frozen: v0.0.69
  hooks:
  - id: ty
    additional_dependencies:
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - homeassistant-stubs
    - manager-for-ynab~=1.9.3
    - pytest
    - pytest-asyncio
    - pytest-homeassistant-custom-component
    - sqlite-export-for-ynab~=2.9.6
- repo: https://github.com/mxr/sync-typing-deps
  rev: a8b960f5e2bb3627b5a1fc8171fe224cdd64ff0a  # frozen: v0.5.4
  hooks:
  - id: sync-typing-deps
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 41e691678310dfd3833f7ab4e180ddb014310356  # frozen: v2.3.0
  hooks:
  - id: mypy
    additional_dependencies:
    - aiosqlite
    - asyncio-for-ynab~=1.86.0
    - coverage
    - homeassistant-stubs
    - manager-for-ynab~=1.9.3
    - pytest
    - pytest-asyncio
    - pytest-homeassistant-custom-component
    - sqlite-export-for-ynab~=2.9.6
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: debug-statements
  - id: end-of-file-fixer
  - id: pretty-format-json
    args: [--autofix]
  - id: trailing-whitespace
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies:
    - github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 8108cc202d2aa2732b21d48507152c95ee244030  # frozen: 4.3.0
  hooks:
  - id: sqlfluff-fix
    args: [--dialect, sqlite]
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
